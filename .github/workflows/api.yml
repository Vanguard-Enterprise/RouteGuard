name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - "routeguard-api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: routeguard-api

    steps:
      - name: Create GitHub deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'api',
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
              environment_url: 'https://api.route-guard.com',
            });
            return data.id;
          result-encoding: string

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: routeguard-api/go.sum

      - name: Run tests
        run: go test ./... -v -count=1

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            -t localhost:5000/routeguard-api:latest \
            -t localhost:5000/routeguard-api:${{ github.sha }} \
            routeguard-api/

      - name: Push to local registry
        working-directory: ${{ github.workspace }}
        run: |
          docker push localhost:5000/routeguard-api:latest
          docker push localhost:5000/routeguard-api:${{ github.sha }}

      - name: Deploy
        working-directory: /opt/routeguard/deploy
        run: |
          git -C /opt/routeguard pull
          docker compose pull routeguard-api
          docker compose up -d --no-deps --force-recreate routeguard-api

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.deployment.outputs.result }}'),
              state: 'success',
              environment_url: 'https://api.route-guard.com',
            });

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.result
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.deployment.outputs.result }}'),
              state: 'failure',
            });
