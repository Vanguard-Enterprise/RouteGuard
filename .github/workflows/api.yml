name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - "routeguard-api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  setup:
    runs-on: self-hosted
    permissions:
      contents: read
      deployments: write
    outputs:
      deployment_id: ${{ steps.deployment.outputs.result }}
    steps:
      - name: Create GitHub deployment
        uses: actions/github-script@v8
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'api',
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
              environment_url: 'https://api.route-guard.com',
            });
            return data.id;
          result-encoding: string

  test:
    runs-on: self-hosted
    needs: setup
    defaults:
      run:
        working-directory: routeguard-api
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Run tests
        run: go test ./...

  build:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --cache-from localhost:5000/routeguard-api:latest \
            -t localhost:5000/routeguard-api:latest \
            -t localhost:5000/routeguard-api:${{ github.sha }} \
            routeguard-api/

      - name: Push to local registry
        working-directory: ${{ github.workspace }}
        run: |
          docker push localhost:5000/routeguard-api:latest
          docker push localhost:5000/routeguard-api:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: [setup, test, build]
    permissions:
      deployments: write
    steps:
      - name: Deploy
        working-directory: /opt/routeguard/deploy
        run: |
          git -C /opt/routeguard pull
          docker compose pull routeguard-api
          docker compose up -d --no-deps --force-recreate routeguard-api

      - name: Mark deployment success
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ needs.setup.outputs.deployment_id }}'),
              state: 'success',
              environment_url: 'https://api.route-guard.com',
            });

  notify-failure:
    runs-on: self-hosted
    needs: [setup, test, build, deploy]
    if: failure() && needs.setup.result == 'success'
    permissions:
      deployments: write
    steps:
      - name: Mark deployment failure
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ needs.setup.outputs.deployment_id }}'),
              state: 'failure',
            });
