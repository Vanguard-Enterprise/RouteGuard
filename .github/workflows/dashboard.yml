name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ROUTEGUARD_IMAGE: ghcr.io/vanguard-enterprise/routeguard-dashboard

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: write
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Create GitHub deployment
        uses: actions/github-script@v8
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'dashboard',
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
              environment_url: 'https://route-guard.com',
            });
            return data.id;
          result-encoding: string

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The standalone demo currently has pre-existing React compiler lint findings.
        # Keep them visible without blocking the production image build; `next build`
        # remains the deployment gate.
        continue-on-error: true
        run: npm run lint

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --cache-from type=registry,ref=${ROUTEGUARD_IMAGE}:main \
            -t ${ROUTEGUARD_IMAGE}:main \
            -t ${ROUTEGUARD_IMAGE}:${{ github.sha }} \
            dashboard/

      - name: Push image to GHCR
        working-directory: ${{ github.workspace }}
        run: |
          docker push ${ROUTEGUARD_IMAGE}:main
          docker push ${ROUTEGUARD_IMAGE}:${{ github.sha }}

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.deployment.outputs.result }}'),
              state: 'success',
              environment_url: 'https://route-guard.com',
            });

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.result
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.deployment.outputs.result }}'),
              state: 'failure',
            });
