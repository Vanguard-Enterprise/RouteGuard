name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Create GitHub deployment
        uses: actions/github-script@v8
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'dashboard',
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
              environment_url: 'https://route-guard.com',
            });
            return data.id;
          result-encoding: string

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --cache-from localhost:5000/routeguard-dashboard:latest \
            --build-arg NEXT_PUBLIC_API_URL=https://api.route-guard.com \
            --build-arg NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }} \
            -t localhost:5000/routeguard-dashboard:latest \
            -t localhost:5000/routeguard-dashboard:${{ github.sha }} \
            dashboard/

      - name: Push to local registry
        working-directory: ${{ github.workspace }}
        run: |
          docker push localhost:5000/routeguard-dashboard:latest
          docker push localhost:5000/routeguard-dashboard:${{ github.sha }}

      - name: Deploy
        working-directory: /opt/routeguard/deploy
        run: |
          git -C /opt/routeguard fetch origin main
          git -C /opt/routeguard checkout -f main
          git -C /opt/routeguard reset --hard origin/main
          docker compose pull dashboard
          docker compose up -d --no-deps --force-recreate dashboard

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.deployment.outputs.result }}'),
              state: 'success',
              environment_url: 'https://route-guard.com',
            });

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.result
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.deployment.outputs.result }}'),
              state: 'failure',
            });
