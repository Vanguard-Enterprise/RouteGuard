apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeguard
  labels:
    app.kubernetes.io/name: routeguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routeguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routeguard
    spec:
      containers:
        - name: dashboard
          image: routeguard-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: routeguard
  labels:
    app.kubernetes.io/name: routeguard
spec:
  selector:
    app.kubernetes.io/name: routeguard
  ports:
    - name: http
      port: 80
      targetPort: http
