tls:
  certificates:
    - certFile: /certs/fullchain.pem
      keyFile: /certs/key.pem

http:
  routers:
    dashboard:
      rule: "Host(`route-guard.com`) || Host(`www.route-guard.com`)"
      entryPoints:
        - websecure
      tls: {}
      service: dashboard-svc
      middlewares:
        - www-redirect
        - secure-headers

    api:
      rule: "Host(`api.route-guard.com`)"
      entryPoints:
        - websecure
      tls: {}
      service: api-svc
      middlewares:
        - secure-headers

    storage:
      rule: "Host(`storage.route-guard.com`)"
      entryPoints:
        - websecure
      tls: {}
      service: storage-svc
      middlewares:
        - secure-headers

  services:
    dashboard-svc:
      loadBalancer:
        servers:
          - url: "http://dashboard:3000"

    api-svc:
      loadBalancer:
        servers:
          - url: "http://routeguard-api:8080"

    storage-svc:
      loadBalancer:
        servers:
          - url: "http://rustfs:9000"

  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

    www-redirect:
      redirectRegex:
        regex: "^https://www\\.route-guard\\.com/(.*)"
        replacement: "https://route-guard.com/${1}"
        permanent: true
